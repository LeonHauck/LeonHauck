name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LeonHauck
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300FF9C&color_dots=%230D1117,%230f3d2c,%23145c3f,%2300b368,%2300FF9C&color_outline=%2300FF9C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300FF9C

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
